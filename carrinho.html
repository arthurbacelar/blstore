<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confira os itens selecionados e o total da sua compra na BLSTORE.">
  <title>Carrinho | BLSTORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="BLSTORE, página inicial">BLSTORE<span>.</span></a>

      <a href="index.html">Início</a>
